<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UNO · 网页版</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__logo">UNO</span>
        <span class="brand__sub">单机 · 人机对战</span>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--ghost" id="btnRules" type="button">规则说明</button>
        <button class="btn btn--ghost" id="btnLog" type="button">对局日志</button>
        <button class="btn btn--ghost" id="btnRestart" type="button">重新开局</button>
      </div>
    </header>

    <main class="stage">
      <section class="opponents" id="opponents" aria-label="对手席位"></section>

      <section class="table" aria-label="牌桌">
        <div class="pile-wrap">
          <button class="pile pile--draw" id="drawPile" type="button" aria-label="摸牌堆">
            <span class="pile__stack">
              <span class="card card--back"></span>
              <span class="card card--back"></span>
              <span class="card card--back"></span>
            </span>
            <span class="pile__count" id="drawCount">0</span>
          </button>
          <span class="pile__label">摸牌堆</span>
        </div>

        <div class="table__meta">
          <div class="dir" id="dirIcon" title="出牌方向">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 12a8.2 8.2 0 1 1-2.4-5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M20.2 4.2v4.9h-4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="color-pill" id="colorPill">
            <span class="color-pill__dot" id="colorDot"></span>
            <span class="color-pill__text" id="colorText">红</span>
          </div>
          <p class="table__hint" id="tableHint">准备开始</p>
        </div>

        <div class="pile-wrap">
          <div class="pile pile--discard" id="discardPile" aria-label="弃牌堆"></div>
          <span class="pile__label">弃牌堆</span>
        </div>
      </section>

      <section class="hand-area">
        <div class="hand-bar">
          <span class="hand-bar__turn" id="turnBanner">等待开始</span>
          <div class="hand-bar__actions" id="handActions"></div>
        </div>
        <div class="hand" id="hand" aria-label="我的手牌"></div>
      </section>
    </main>

    <aside class="log" id="logPanel" aria-label="对局日志">
      <header class="log__head">
        <h2 class="log__title">对局日志</h2>
        <button class="icon-btn" id="btnLogClose" type="button" aria-label="关闭">✕</button>
      </header>
      <ul class="log__list" id="logList"></ul>
    </aside>
  </div>

  <div class="modal" id="setupModal">
    <div class="modal__card">
      <p class="modal__kicker">网页版 UNO</p>
      <h1 class="modal__title">开一局</h1>
      <p class="modal__sub">经典 108 张牌组，精简规则，先出完手牌者获胜。</p>

      <div class="opt">
        <span class="opt__legend">玩家人数</span>
        <div class="seg" id="optPlayers">
          <button type="button" data-value="2">2 人</button>
          <button type="button" data-value="3">3 人</button>
          <button type="button" data-value="4" class="is-active">4 人</button>
        </div>
      </div>

      <div class="opt">
        <span class="opt__legend">AI 难度</span>
        <div class="seg" id="optDifficulty">
          <button type="button" data-value="easy">简单</button>
          <button type="button" data-value="normal" class="is-active">普通</button>
          <button type="button" data-value="hard">困难</button>
        </div>
      </div>

      <button class="btn btn--primary btn--block" id="btnStart" type="button">开始游戏</button>
      <button class="link-btn" id="btnRulesSetup" type="button">第一次玩？先看规则与牌型说明</button>
    </div>
  </div>

  <div class="modal" id="rulesModal" hidden>
    <div class="modal__card modal__card--wide">
      <header class="rules__head">
        <div>
          <p class="modal__kicker">怎么玩</p>
          <h2 class="modal__title modal__title--sm">规则与牌型说明</h2>
        </div>
        <button class="icon-btn" id="btnRulesClose" type="button" aria-label="关闭">✕</button>
      </header>
      <div class="rules__body" id="rulesBody"></div>
      <footer class="rules__foot">
        <button class="btn btn--primary btn--block" id="btnRulesOk" type="button">知道了</button>
      </footer>
    </div>
  </div>

  <div class="modal" id="colorModal" hidden>
    <div class="modal__card modal__card--tight">
      <h2 class="modal__title modal__title--sm">选择颜色</h2>
      <p class="modal__sub">打出万能牌后，由你指定接下来的颜色。</p>
      <div class="color-grid" id="colorGrid">
        <button class="color-btn color-btn--red" type="button" data-color="red"><span>红</span></button>
        <button class="color-btn color-btn--yellow" type="button" data-color="yellow"><span>黄</span></button>
        <button class="color-btn color-btn--green" type="button" data-color="green"><span>绿</span></button>
        <button class="color-btn color-btn--blue" type="button" data-color="blue"><span>蓝</span></button>
      </div>
      <button class="btn btn--ghost btn--block" id="btnCancelColor" type="button">取消</button>
    </div>
  </div>

  <div class="modal" id="overModal" hidden>
    <div class="modal__card modal__card--tight">
      <p class="modal__kicker" id="overKicker">对局结束</p>
      <h2 class="modal__title" id="overTitle">你赢了</h2>
      <p class="modal__sub" id="overText"></p>
      <button class="btn btn--primary btn--block" id="btnAgain" type="button">再来一局</button>
      <button class="btn btn--ghost btn--block" id="btnBackHome" type="button">返回设置</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
